<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE 藍牙調音台 - R&D 控制中心</title>
    <style>
        :root { --primary: #3498db; --bg: #f4f7f6; --text: #2c3e50; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 20px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 500px; }
        .control-group { margin-bottom: 15px; background: #f8f9fa; padding: 12px; border-radius: 8px; }
        .control-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        .val-badge { background: var(--primary); color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .status-bar { text-align: center; font-size: 14px; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
        .status-offline { background: #ffeaa7; color: #d63031; }
        .status-online { background: #dff9fb; color: #27ae60; }
        button { background-color: #3498db; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed;}
    </style>
</head>
<body>

<div class="container">
    <div id="ble-status" class="status-bar status-offline">🔴 藍牙未連線</div>
    
    <button id="connectBtn" onclick="connectBLE()">📡 點擊連線藍牙助聽器</button>

    <div id="tuning" style="opacity: 0.4; pointer-events: none;">
        <div id="scene_display" class="status-bar" style="background: #95a5a6; color: white; transition: background 0.3s;">🧠 智能場景：等待偵測...</div>
        <div class="control-group">
            <div class="control-header"><span>🎧 總音量 (Master)</span> <span id="val_master" class="val-badge">0.20</span></div>
            <input type="range" id="slider_master" min="0" max="1" step="0.05" value="0.2" oninput="sendTuningCmd('set_master_vol', this.value, 'val_master')">
        </div>
        <div class="control-group">
            <div class="control-header"><span>🎤 側音比例 (Sidetone)</span> <span id="val_sidetone" class="val-badge">0.50</span></div>
            <input type="range" id="slider_sidetone" min="0" max="2" step="0.1" value="0.5" oninput="sendTuningCmd('set_sidetone', this.value, 'val_sidetone')">
        </div>
        <div class="control-group">
            <div class="control-header"><span>📞 通話比例 (HFP)</span> <span id="val_call" class="val-badge">0.80</span></div>
            <input type="range" id="slider_call" min="0" max="2" step="0.1" value="0.8" oninput="sendTuningCmd('set_callvol', this.value, 'val_call')">
        </div>
        <hr style="border:0; border-top:1px solid #ddd; margin: 20px 0;">
        <h4 style="margin-top:0;">8段 EQ 調整 (dB)</h4>
        <div id="eq-container"></div>
        <hr style="border:0; border-top:1px solid #ddd; margin: 20px 0;">
        <button id="saveBtn" onclick="saveToFlash()" style="background-color: #f39c12;">💾 永久儲存當前參數至耳機</button>
        <button id="defaultBtn" onclick="loadDefault()" style="background-color: #e74c3c;">🔄 恢復原廠預設值</button>
        
        <!-- 新增藍牙名稱設定區塊 -->
        <hr style="border:0; border-top:1px solid #ddd; margin: 20px 0;">
        <h4 style="margin-top:0;">📛 藍牙名稱動態設定</h4>
        <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 8px;">
            <label style="flex: 1; font-size: 14px;">傳統藍牙 (BT): </label>
            <input type="text" id="btNameInput" placeholder="例如: ESP32_ANC" maxlength="31" style="flex: 2; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
            <button onclick="sendNameCmd('bt')" style="width: auto; padding: 8px 12px; margin: 0; background-color: #27ae60;">更新</button>
        </div>
        <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 8px;">
            <label style="flex: 1; font-size: 14px;">低功耗藍牙 (BLE): </label>
            <input type="text" id="bleNameInput" placeholder="例如: Tune" maxlength="31" style="flex: 2; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
            <button onclick="sendNameCmd('ble')" style="width: auto; padding: 8px 12px; margin: 0; background-color: #27ae60;">更新</button>
        </div>
        <p style="color: #c0392b; font-size: 0.8em; margin-top: 5px;">* 提醒：更改後，手機藍牙可能需要「忘記此裝置」並重連才會顯示新名稱。</p>
        
        <hr style="border:0; border-top:1px solid #ddd; margin: 20px 0;">
        <h4 style="margin-top:0;">💻 R&D 無線終端機 (BLE Console)</h4>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <input type="text" id="cmdInput" placeholder="輸入指令 (例: statusfft, RD_DEBUG)" 
                   style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: monospace;">
            <button onclick="sendConsoleCmd()" style="width: 80px; margin: 0; background-color: #2c3e50;">發送</button>
        </div>
        <textarea id="consoleOutput" rows="6" readonly 
                  style="width: 100%; box-sizing: border-box; background: #1e1e1e; color: #00ff00; font-family: monospace; padding: 10px; border-radius: 8px; resize: vertical;"></textarea>
        
        <button id="rdExportBtn" onclick="startLogCollection()" 
                style="display: none; background-color: #8e44ad; margin-top: 10px;">
            📥 一鍵收集並下載系統完整 Log (.txt)
        </button>
    </div>
</div>

<script>
    // 全域變數定義
    let bleDevice = null;
    let txCharacteristic = null;
    let pendingCommands = {}; 
    let isSending = false;
    let isCollectingLog = false;
    let collectedLogData = "";

    // ⭐ 0. 自動注入「硬體自檢」與「聽力驗配」UI 面板 (使用 \x3c 與 \x3e 防止聊天視窗吃字)
    (function injectSelfTestUI() {
        const style = document.createElement('style');
        style.textContent = `
            .diag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
            .diag-item { background: #fff; border: 1px solid #e1e8ed; padding: 8px 10px; border-radius: 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
            .ok-tag { color: #27ae60; font-weight: bold; }
            .err-tag { color: #e74c3c; font-weight: bold; }
        `;
        document.head.appendChild(style);

        const defaultBtn = document.getElementById('defaultBtn');
        if (defaultBtn) {
            const uiHtml = 
                '\x3chr style="border:0; border-top:1px solid #ddd; margin: 20px 0;"\x3e' +
                '\x3ch4 style="margin-top:0;"\x3e🛠️ 硬體與雙機健康自檢 (Self-Test)\x3c/h4\x3e' +
                '\x3cdiv class="control-group"\x3e' +
                    '\x3cdiv style="display: flex; gap: 8px;"\x3e' +
                        '\x3cbutton onclick="sendQuickCmd(\'ble_diag\')" style="background-color: #2980b9; padding: 10px; font-size: 14px; margin-bottom: 6px;"\x3e🔍 執行硬體自檢\x3c/button\x3e' +
                        '\x3cbutton onclick="sendQuickCmd(\'web_tone 1000 65\')" style="background-color: #16a085; padding: 10px; font-size: 14px; margin-bottom: 6px;"\x3e🔊 1kHz 喇叭測試\x3c/button\x3e' +
                    '\x3c/div\x3e' +
                    '\x3cdiv class="diag-grid"\x3e' +
                        '\x3cdiv class="diag-item"\x3e\x3cspan\x3eES8311 (DAC)\x3c/span\x3e\x3cspan id="dg_dac"\x3e--\x3c/span\x3e\x3c/div\x3e' +
                        '\x3cdiv class="diag-item"\x3e\x3cspan\x3eES7243E (ADC)\x3c/span\x3e\x3cspan id="dg_adc"\x3e--\x3c/span\x3e\x3c/div\x3e' +
                        '\x3cdiv class="diag-item"\x3e\x3cspan\x3eI2C 重試次數\x3c/span\x3e\x3cspan id="dg_i2c"\x3e--\x3c/span\x3e\x3c/div\x3e' +
                        '\x3cdiv class="diag-item"\x3e\x3cspan\x3e耳機孔狀態\x3c/span\x3e\x3cspan id="dg_hp"\x3e--\x3c/span\x3e\x3c/div\x3e' +
                        '\x3cdiv class="diag-item"\x3e\x3cspan\x3eSLAVE 信標\x3c/span\x3e\x3cspan id="dg_slave"\x3e--\x3c/span\x3e\x3c/div\x3e' +
                        '\x3cdiv class="diag-item"\x3e\x3cspan\x3e當前取樣率\x3c/span\x3e\x3cspan id="dg_sr"\x3e--\x3c/span\x3e\x3c/div\x3e' +
                        '\x3cdiv class="diag-item"\x3e\x3cspan\x3e內部 SRAM\x3c/span\x3e\x3cspan id="dg_sram"\x3e--\x3c/span\x3e\x3c/div\x3e' +
                        '\x3cdiv class="diag-item"\x3e\x3cspan\x3e外部 PSRAM\x3c/span\x3e\x3cspan id="dg_psram"\x3e--\x3c/span\x3e\x3c/div\x3e' +
                    '\x3c/div\x3e' +
                '\x3c/div\x3e' +
                '\x3chr style="border:0; border-top:1px solid #ddd; margin: 20px 0;"\x3e' +
                '\x3ch4 style="margin-top:0;"\x3e🏥 原位聽力驗配自檢 (8頻段 5取3)\x3c/h4\x3e' +
                '\x3cdiv class="control-group"\x3e' +
                    '\x3cdiv style="display: flex; gap: 8px;"\x3e' +
                        '\x3cbutton onclick="startAudiometryUI()" style="background-color: #27ae60; padding: 10px; font-size: 14px; margin-bottom: 6px;"\x3e▶️ 開始自動測聽\x3c/button\x3e' +
                        '\x3cbutton onclick="sendQuickCmd(\'aud_stop\')" style="background-color: #c0392b; padding: 10px; font-size: 14px; margin-bottom: 6px;"\x3e⏹️ 停止測聽\x3c/button\x3e' +
                    '\x3c/div\x3e' +
                    '\x3cdiv id="aud_status" style="background: #fff; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; border: 1px solid #ddd; margin-bottom: 8px;"\x3e' +
                        '點擊「開始自動測聽」後，聽到耳機純音請立即按下方大按鈕' +
                    '\x3c/div\x3e' +
                    '\x3cbutton onclick="sendQuickCmd(\'aud_heard\')" style="background-color: #f39c12; color: #fff; padding: 18px; font-size: 18px; margin-bottom: 4px; box-shadow: 0 4px 10px rgba(243,156,18,0.3);"\x3e' +
                        '👂 我聽到了！ (點此反應)' +
                    '\x3c/button\x3e' +
                    '\x3cdiv id="aud_log" style="font-size: 12px; color: #2c3e50; margin-top: 6px; max-height: 120px; overflow-y: auto;"\x3e\x3c/div\x3e' +
                '\x3c/div\x3e';
            defaultBtn.insertAdjacentHTML('afterend', uiHtml);
        }
    })();

    // 1. 初始化 8 段 EQ 界面
    const eqFreqs = ["250Hz", "500Hz", "1kHz", "2kHz", "3kHz", "4kHz", "6kHz", "8kHz"];
    const eqContainer = document.getElementById('eq-container');

    eqFreqs.forEach(function(freq, idx) {
        const group = document.createElement('div');
        group.className = 'control-group';
        group.style.padding = '8px';
        group.innerHTML = 
            '\x3cdiv class="control-header" style="font-size: 12px;"\x3e' +
                '\x3cspan\x3e📶 ' + freq + '\x3c/span\x3e' +
                '\x3cspan id="val_eq' + idx + '" class="val-badge"\x3e0.0 dB\x3c/span\x3e' +
            '\x3c/div\x3e' +
            '\x3cinput type="range" id="slider_eq' + idx + '" min="-18" max="12" step="0.5" value="0"\x3e';
        eqContainer.appendChild(group);

        const slider = group.querySelector('#slider_eq' + idx);
        slider.oninput = function() {
            document.getElementById('val_eq' + idx).innerText = parseFloat(this.value).toFixed(1) + ' dB';
            pendingCommands['eq ' + idx] = 'eq ' + idx + ' ' + this.value;
        };
    });

    // 2. 定時器：發送緩衝區指令
    setInterval(async function() {
        if (isSending || Object.keys(pendingCommands).length === 0 || !txCharacteristic) return;
        if (!bleDevice || !bleDevice.gatt.connected) return; 

        isSending = true;
        let key = Object.keys(pendingCommands)[0];
        let cmd = pendingCommands[key];
        delete pendingCommands[key];

        try {
            await txCharacteristic.writeValue(new TextEncoder().encode(cmd));
            console.log("✅ 成功同步指令:", cmd);
        } catch (e) {
            console.error("❌ 發送失敗:", e);
            if (e.name !== 'NetworkError' && !e.message.includes('GATT Error Unknown')) {
                pendingCommands[key] = cmd; 
            } else {
                pendingCommands = {};
            }
        } finally {
            isSending = false;
        }
    }, 300);

    // 3. 同步 ESP32 目前數值
    async function syncFromESP32() {
        try {
            const value = await txCharacteristic.readValue();
            const syncData = new TextDecoder().decode(value);
            console.log("📥 收到設備狀態:", syncData);

            if (!syncData.startsWith("SYNC")) return;

            let parts = syncData.split(',');
            document.getElementById('slider_master').value = parseFloat(parts[1]);
            document.getElementById('val_master').innerText = parseFloat(parts[1]).toFixed(2);
            
            document.getElementById('slider_sidetone').value = parseFloat(parts[2]);
            document.getElementById('val_sidetone').innerText = parseFloat(parts[2]).toFixed(2);
            
            document.getElementById('slider_call').value = parseFloat(parts[3]);
            document.getElementById('val_call').innerText = parseFloat(parts[3]).toFixed(2);

            for (let i = 0; i !== 8; i++) {
                let val = parseFloat(parts[i + 4]);
                document.getElementById('slider_eq' + i).value = val;
                document.getElementById('val_eq' + i).innerText = val.toFixed(1) + " dB";
            }
        } catch(e) {
            console.error("同步失敗", e);
        }
    }

    // 4. 初次連線
    async function connectBLE() {
        try {
            document.getElementById('ble-status').innerText = "🟡 請求藍牙權限中...";
            if (!bleDevice) {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ESP32_ANC' }],
                    optionalServices: ['000000ff-0000-1000-8000-00805f9b34fb']
                });
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
            }
            await connectGATT();
        } catch(error) {
            console.error("藍牙連線錯誤:", error); 
            showOffline("🔴 權限被拒絕或連線失敗");
        }
    }

    // ⭐ 5. 接收並解析 ESP32 推播的所有自檢與狀態訊息
    function handleNotifications(event) {
        let value = new TextDecoder().decode(event.target.value).trim();
        console.log("📥 收到 ESP32 推播:", value);

        // (1) 修正：對齊 my_project_3.c 的 STATUS,scene,rms,vad
        if (value.startsWith("STATUS,") || value.startsWith("SCENE,")) {
            let parts = value.split(",");
            let scene_mode = parseInt(parts[1]);
            let extra = (parts.length === 4) ? (' | 能量:' + parts[2] + (parts[3] === '1' ? ' | 🗣️說話中' : ' | 🔇無語音')) : '';
            let sceneBox = document.getElementById("scene_display");
            
            if (scene_mode === 0) {
                sceneBox.innerText = "🟢 智能場景：安靜環境 (通透)" + extra;
                sceneBox.style.background = "#27ae60";
            } else if (scene_mode === 1) {
                sceneBox.innerText = "🟡 智能場景：吵雜環境 (強效降噪)" + extra;
                sceneBox.style.background = "#f39c12";
            } else if (scene_mode === 2) {
                sceneBox.innerText = "🔴 智能場景：對話中 (語音強化)" + extra;
                sceneBox.style.background = "#e74c3c";
            }
            return;
        }

        // (2) 解析硬體自檢報告：DIAG,dac,adc,i2c_err,hp,slave,sram,psram,sr
        if (value.startsWith("DIAG,")) {
            let p = value.split(",");
            document.getElementById("dg_dac").innerHTML   = (p[1] === '1') ? '\x3cspan class="ok-tag"\x3e🟢 正常\x3c/span\x3e' : '\x3cspan class="err-tag"\x3e🔴 異常\x3c/span\x3e';
            document.getElementById("dg_adc").innerHTML   = (p[2] === '1') ? '\x3cspan class="ok-tag"\x3e🟢 正常\x3c/span\x3e' : '\x3cspan class="err-tag"\x3e🔴 異常\x3c/span\x3e';
            document.getElementById("dg_i2c").innerHTML   = (p[3] === '0') ? '\x3cspan class="ok-tag"\x3e0 次\x3c/span\x3e' : ('\x3cspan class="err-tag"\x3e' + p[3] + ' 次\x3c/span\x3e');
            document.getElementById("dg_hp").innerHTML    = (p[4] === '1') ? '\x3cspan class="ok-tag"\x3e🎧 已插入\x3c/span\x3e' : '⚪ 未插入';
            document.getElementById("dg_slave").innerHTML = (p[5] === '1') ? '\x3cspan class="ok-tag"\x3e📡 在線\x3c/span\x3e' : '⚪ 單機';
            document.getElementById("dg_sram").innerText  = p[6] + " KB";
            document.getElementById("dg_psram").innerText = p[7] + " KB";
            document.getElementById("dg_sr").innerText    = p[8] + " Hz";
            printToConsole("[硬體自檢完成] " + value);
            if (isCollectingLog) collectedLogData += value + "\n";
            return;
        }

        // (3) 解析聽力自檢與純音測試回傳
        if (value === "TONE_OK") {
            printToConsole("🔊 1kHz 喇叭測試純音播放完畢");
            return;
        }
        if (value === "AUD_START") {
            document.getElementById("aud_status").innerHTML = "🎧 \x3cb\x3e測聽進行中：聽到耳機純音請立即按下方橘色大按鈕！\x3c/b\x3e";
            return;
        }
        if (value.startsWith("AUD_STEP,")) {
            let p = value.split(",");
            document.getElementById("aud_status").innerHTML = 
                "🎵 正在測試 \x3cb\x3e" + p[2] + " Hz\x3c/b\x3e (第 " + p[3] + "/5 輪) — 當前音量：\x3cb\x3e" + p[4] + " dB HL\x3c/b\x3e";
            return;
        }
        if (value.startsWith("AUD_BAND,")) {
            let p = value.split(",");
            let logDiv = document.getElementById("aud_log");
            logDiv.innerHTML += "\x3cdiv\x3e✅ \x3cb\x3e" + p[2] + " Hz\x3c/b\x3e 聽閾判定: \x3cb\x3e" + p[3] + " dB\x3c/b\x3e ➔ 自動補償 EQ: \x3cb\x3e+" + p[4] + " dB\x3c/b\x3e\x3c/div\x3e";
            logDiv.scrollTop = logDiv.scrollHeight;
            return;
        }
        if (value.startsWith("AUD_ERR,")) {
            let p = value.split(",");
            let logDiv = document.getElementById("aud_log");
            logDiv.innerHTML += '\x3cdiv style="color:#e74c3c;"\x3e⚠️ \x3cb\x3e' + p[2] + ' Hz\x3c/b\x3e 測試波動過大，維持原設定\x3c/div\x3e';
            logDiv.scrollTop = logDiv.scrollHeight;
            return;
        }
        if (value === "AUD_DONE") {
            document.getElementById("aud_status").innerHTML = "🎉 \x3cb\x3e8 頻段測聽驗配完成！專屬 EQ 已套用並同步至滑桿\x3c/b\x3e";
            syncFromESP32();
            return;
        }
        if (value === "AUD_STOP") {
            document.getElementById("aud_status").innerHTML = "⏹️ 測聽已手動停止";
            return;
        }

        // (4) 其他一般訊息印到黑色 Console
        printToConsole(value);
        if (isCollectingLog) {
            collectedLogData += value + "\n";
        }
    }

    // 6. 背景靜默重連與連線初始化
    async function connectGATT() {
        document.getElementById('ble-status').innerText = "🟡 建立底層 GATT 連線...";
        try {
            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService('000000ff-0000-1000-8000-00805f9b34fb');
            txCharacteristic = await service.getCharacteristic('0000ff01-0000-1000-8000-00805f9b34fb');

            await txCharacteristic.startNotifications();
            txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);
            await syncFromESP32();

            document.getElementById('ble-status').className = 'status-bar status-online';
            document.getElementById('ble-status').innerText = '🟢 藍牙已連線 (' + (bleDevice.name || 'ESP32') + ')';
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('tuning').style.opacity = '1';
            document.getElementById('tuning').style.pointerEvents = 'auto';

            // 連上後自動執行一次硬體健康自檢
            setTimeout(function() { sendQuickCmd('ble_diag'); }, 400);
        } catch (e) {
            console.error("❌ GATT 失敗:", e);
            showOffline("🔴 GATT 連線失敗，請手動重連");
        }
    }

    async function sendQuickCmd(cmd) {
        if (!txCharacteristic) { alert("請先連線藍牙！"); return; }
        try {
            await txCharacteristic.writeValue(new TextEncoder().encode(cmd));
        } catch (e) {
            console.error("❌ 發送失敗:", e);
        }
    }

    function startAudiometryUI() {
        document.getElementById("aud_log").innerHTML = "";
        document.getElementById("aud_status").innerHTML = "⏳ 正在啟動 8 頻段原位測聽...";
        sendQuickCmd("aud_start");
    }

    function onDisconnected(event) {
        txCharacteristic = null;
        isSending = false;
        pendingCommands = {};

        document.getElementById('ble-status').className = 'status-bar status-offline';
        document.getElementById('ble-status').innerText = '🔴 藍牙已斷線，3秒後背景自動重連...';
        document.getElementById('tuning').style.opacity = '0.4';
        document.getElementById('tuning').style.pointerEvents = 'none';
        document.getElementById('scene_display').innerText = "🧠 智能場景：等待偵測...";
        document.getElementById('scene_display').style.background = "#95a5a6";

        setTimeout(function() {
            if (bleDevice && !bleDevice.gatt.connected) {
                connectGATT().catch(function(e) {
                    showOffline("🔴 背景重連失敗，請點擊按鈕手動連線");
                });
            }
        }, 3000);
    }

    function showOffline(msg) {
        document.getElementById('ble-status').className = 'status-bar status-offline';
        document.getElementById('ble-status').innerText = msg;
        document.getElementById('connectBtn').style.display = 'block';
        document.getElementById('tuning').style.opacity = '0.4';
        document.getElementById('tuning').style.pointerEvents = 'none';
    }

    async function loadDefault() {
        if (!txCharacteristic) { alert("請先連線藍牙！"); return; }
        if (confirm("⚠️ 確定要恢復原廠預設參數嗎？這會重置所有音量與 EQ 設定。")) {
            try {
                await txCharacteristic.writeValue(new TextEncoder().encode("load_default"));
                await new Promise(function(r) { setTimeout(r, 500); });
                await syncFromESP32();
                alert("✅ 已成功恢復原廠預設值！");
            } catch (e) {
                alert("恢復失敗，請重連");
            }
        }
    }

    function sendTuningCmd(cmdName, value, displayId) {
        document.getElementById(displayId).innerText = parseFloat(value).toFixed(2);
        pendingCommands[cmdName] = cmdName + " " + value;
    }

    async function saveToFlash() {
        if (!txCharacteristic) return;
        pendingCommands = {}; 
        try {
            await txCharacteristic.writeValue(new TextEncoder().encode("save_all"));
            alert("💾 參數已成功永久寫入耳機！");
        } catch (e) { 
            alert("儲存失敗，請重連"); 
        }
    }

    // ⭐ 修正：補上等號對齊 my_project_3.c 的 set_bt_name= 與 set_ble_name=
    async function sendNameCmd(type) {
        if (!txCharacteristic) { alert("❌ 錯誤：藍牙未連線"); return; }
        let cmd = "";
        if (type === 'bt') {
            let newName = document.getElementById("btNameInput").value.trim();
            if (newName === "") { alert("請輸入傳統藍牙名稱！"); return; }
            cmd = "set_bt_name=" + newName;
            document.getElementById("btNameInput").value = "";
        } else if (type === 'ble') {
            let newName = document.getElementById("bleNameInput").value.trim();
            if (newName === "") { alert("請輸入 BLE 名稱！"); return; }
            cmd = "set_ble_name=" + newName;
            document.getElementById("bleNameInput").value = "";
        }

        try {
            await txCharacteristic.writeValue(new TextEncoder().encode(cmd));
            alert("✅ 指令已發送！\n" + cmd);
        } catch (e) {
            alert("發送失敗，請確認藍牙連線狀態");
        }
    }

    function printToConsole(text, isInput = false) {
        let out = document.getElementById("consoleOutput");
        if (!out) return;
        let prefix = isInput ? "\x3e\x3e " : "";
        out.value += prefix + text + "\n";
        out.scrollTop = out.scrollHeight;
    }

    document.addEventListener("DOMContentLoaded", function() {
        let inputField = document.getElementById("cmdInput");
        if (inputField) {
            inputField.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    sendConsoleCmd();
                }
            });
        }
    });

    async function sendConsoleCmd() {
        let inputField = document.getElementById("cmdInput");
        let cmd = inputField.value.trim();
        if (!cmd) return;
        
        if (cmd === "RD_DEBUG") {
            document.getElementById("rdExportBtn").style.display = "block";
            printToConsole("🔓 已解鎖 R&D 進階除錯模式！", true);
            inputField.value = "";
            return;
        }

        printToConsole(cmd, true); 
        inputField.value = "";     
        if (!txCharacteristic) { printToConsole("❌ 錯誤：藍牙未連線"); return; }

        try {
            await txCharacteristic.writeValue(new TextEncoder().encode(cmd));
        } catch (e) {
            printToConsole("❌ 發送失敗：" + e);
        }
    }

    function downloadTxtFile(text, filename) {
        let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        let url = URL.createObjectURL(blob);
        let a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    async function startLogCollection() {
        if (!txCharacteristic) return;
        let btn = document.getElementById("rdExportBtn");
        btn.innerText = "⏳ 正在與 ESP32 溝通收集 Log 中 (約需 3.5 秒)...";
        btn.disabled = true;

        isCollectingLog = true;
        let now = new Date();
        collectedLogData = "=========================================\n";
        collectedLogData += "   Hearing Aid System R&D Report\n";
        collectedLogData += "   Generated: " + now.toLocaleString() + "\n";
        collectedLogData += "=========================================\n\n";

        let commandsToRun = [
            "ble_diag",
            "statusfft",
            "show_eq",
            "read_limit_bigsound",
            "read_gate",
            "i2sset",
            "status7243",
            "status8311"
        ];

        for (let cmd of commandsToRun) {
            collectedLogData += "\n\x3e\x3e Executing: " + cmd + "\n";
            collectedLogData += "-----------------------------------------\n";
            try {
                await txCharacteristic.writeValue(new TextEncoder().encode(cmd));
                await new Promise(function(r) { setTimeout(r, 450); }); 
            } catch (e) {
                collectedLogData += "[Error sending command: " + e + "]\n";
            }
        }

        isCollectingLog = false;
        btn.innerText = "✅ 收集完成！檔案已下載";
        let timeStr = now.toISOString().replace(/[:T\-]/g, "").replace(/\..+/, "").replace(/\s/g, "_");
        downloadTxtFile(collectedLogData, "RD_Report_" + timeStr + ".txt");

        setTimeout(function() {
            btn.innerText = "📥 一鍵收集並下載系統完整 Log (.txt)";
            btn.disabled = false;
        }, 3000);
    }
</script>
